# unityworks-team project configuration — format: the plugin's team-setup skill.
# One "key = value" per line; repeat a key for a list; " :: " separates parts.

name    = Vision AI backend
kind    = vision-backend
reviews = docs/reviews
related = frontend :: vision-frontend

# Migrated verbatim from their source; tests/app/test_migration.py asserts it.
protect        = vision_os/ :: vision_os/ is migrated byte-identical from its source and excluded from lint; editing it breaks the migration invariant asserted by tests/app/test_migration.py.
protect        = compliance/ :: compliance/ is migrated verbatim and excluded from lint.
protect        = tools/ :: tools/ is migrated verbatim and excluded from lint.
protect-except = tests/

remind = app/api/ :: Route surface changed. The frontend is typed from the committed schema: run .venv/Scripts/python.exe scripts/export_openapi.py here, then npm run types:generate in the frontend, then /check contract. Procedure: contract-sync skill.

block = alembic downgrade :: Downgrades drop columns and partitions. Restore from a backup or write a new forward migration instead.

# gate = <watched prefixes> :: <text proving it ran> :: <command>
gate = app/ tests/ migrations/ scripts/ :: pytest :: .venv/Scripts/python.exe -m pytest
gate = app/ tests/ :: ruff check :: .venv/Scripts/python.exe -m ruff check app tests
gate = app/ tests/ :: black :: .venv/Scripts/python.exe -m black --check app tests
gate = app/api/ :: export_openapi :: .venv/Scripts/python.exe scripts/export_openapi.py --check

check = contract :: bash "$REPO_FRONTEND/.claude/team/checks/contract-check"

agent = vision-specialist

# Agents may run migrations only against a disposable SQLite file.
advisor-allow = DATABASE_URL_OVERRIDE=sqlite
advisor-block = alembic upgrade :: Migrations against the configured database are not a reviewer's act; use DATABASE_URL_OVERRIDE=sqlite+aiosqlite:///<temp>/check.db as the db-migration skill shows.
advisor-block = alembic stamp :: Stamping changes the configured database's recorded revision.

harden = default :: security-engineer architecture-auditor devops-engineer qa-engineer release-scribe
harden = auth :: security-engineer backend-engineer qa-engineer
harden = contract :: devops-engineer backend-engineer frontend-engineer
harden = vision :: vision-specialist architecture-auditor backend-engineer qa-engineer
harden = release :: devops-engineer release-scribe product-analyst security-engineer architecture-auditor

release-skill = prod-readiness
