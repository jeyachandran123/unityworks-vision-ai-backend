# Alembic configuration.
#
# The URL is deliberately absent: `migrations/env.py` reads it from the
# application settings. A connection string in a committed ini file is a
# credential in a committed ini file.

[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# timezone: omitted deliberately. Alembic resolves it through tzdata, which is
# not present on every host, and a migration tool that fails on a cosmetic
# timestamp setting is a migration tool that blocks a deploy for no reason.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
